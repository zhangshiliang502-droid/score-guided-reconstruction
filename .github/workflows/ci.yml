name: Source validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out source without retained LFS results
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            experiments/empirical_vs_trained_small_sigma/requirements.txt
      - name: Install method and experiment dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r experiments/empirical_vs_trained_small_sigma/requirements.txt
      - name: Validate the source release profile
        run: python tools/validate_release.py --profile source
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run reduced CPU training smoke test
        if: matrix.python-version == '3.11'
        run: python tools/smoke_test_lowdim.py
